name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Action lint
        uses: open-turo/actions-jvm/lint@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          checkout-repo: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check
        run: ./gradlew spotlessCheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .java-version

      # The lexicon corpus is committed under generator/lexicons/, so CI
      # never hits the network and an upstream republish can't turn every
      # PR red. Upstream drift is picked up by lexicon-refresh.yaml, which
      # opens a PR instead. This check only guards that the committed files
      # and the CID manifest describe the same set of NSIDs.
      - name: Verify lexicon corpus matches manifest
        working-directory: generator
        run: |
          set -euo pipefail
          diff \
            <(jq -r '.resolutions | keys[]' lexicons.json | sort) \
            <(find lexicons -name '*.json' -print0 | xargs -0 jq -r '.id' | sort)

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Runtime + generator tests
        run: ./gradlew :runtime:jvmTest :generator:test

      - name: Android sample unit tests
        run: ./gradlew :samples:android:testDebugUnitTest

      # Track public API surface for :runtime, :models, :oauth via the
      # kotlinx-binary-compatibility-validator plugin. Fails if any
      # change to public symbols isn't accompanied by an updated
      # <module>/api/<module>.api dump (for example, `runtime/api/runtime.api`;
      # regenerate with `./gradlew apiDump`).
      - name: Public API surface check
        run: ./gradlew apiCheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # JVM-only build on Linux. iOS targets need macOS runners — add
      # a separate job for `linkDebugFrameworkIos*` tasks when there's
      # a real need.
      - name: Compile library (JVM)
        run: ./gradlew :runtime:compileKotlinJvm :models:compileKotlinJvm

      - name: Build Android sample APK
        run: ./gradlew :samples:android:assembleDebug

      # Catches Android Lint regressions (Instantiatable, NewApi, accessibility,
      # etc.) on :samples:android. Kept here rather than in the Lint job because
      # this job has the Android SDK + lexicon corpus already set up.
      - name: Android sample lint
        run: ./gradlew :samples:android:lintDebug

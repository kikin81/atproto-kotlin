name: Lexicon bump

# Detect upstream @atproto/lex drift on a schedule and open a PR with
# the bumped npm version, refreshed corpus (generator/lexicons/ + CIDs in
# lexicons.json), re-dumped models.api, and validated generator output.
# Schema-only republishes are handled daily by lexicon-refresh.yaml.
# Manual workflow_dispatch lets a maintainer trigger an ad-hoc bump from
# the Actions tab.

on:
  schedule:
    # 14:00 UTC Mondays → 7am PT, leaves the week to review the bump PR
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump @atproto/lex
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Use a PAT (not GITHUB_TOKEN) so the PR opened below triggers
          # CI on its own branch — GitHub suppresses workflow runs for
          # commits made via the default token.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Snapshot pre-bump state
        id: pre
        working-directory: generator
        run: |
          set -euo pipefail
          old_version=$(jq -r '.dependencies["@atproto/lex"]' package.json)
          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
          cp lexicons.json "$RUNNER_TEMP/lexicons.before.json"

      - name: Bump @atproto/lex to latest
        working-directory: generator
        run: npm install @atproto/lex@latest --save-exact

      - name: Refresh lexicon corpus
        working-directory: generator
        # No --ci flag here: we want lex install to rewrite lexicons.json
        # against whatever the newly-installed @atproto/lex package ships.
        run: npx lex install

      - name: Regenerate models and API dump
        # Validates the new corpus compiles end-to-end before opening the
        # PR, and re-dumps models.api so the PR's own apiCheck passes.
        run: |
          ./gradlew :generator:generateModels --no-configuration-cache
          ./gradlew :models:apiDump

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- generator/package.json generator/package-lock.json \
              generator/lexicons.json generator/lexicons models/api/models.api \
            && [ -z "$(git ls-files --others --exclude-standard -- generator/lexicons)" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture post-bump version
        id: post
        if: steps.diff.outputs.changes == 'true'
        working-directory: generator
        run: |
          set -euo pipefail
          new_version=$(jq -r '.dependencies["@atproto/lex"]' package.json)
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        id: body
        if: steps.diff.outputs.changes == 'true'
        env:
          OLD_VERSION: ${{ steps.pre.outputs.old_version }}
          NEW_VERSION: ${{ steps.post.outputs.new_version }}
        run: |
          set -euo pipefail
          .github/scripts/lexicon-change-report.sh \
            "$RUNNER_TEMP/lexicons.before.json" \
            "Bumps \`@atproto/lex\` from \`${OLD_VERSION}\` to \`${NEW_VERSION}\`." \
            > "$RUNNER_TEMP/pr_body.md"
          {
            echo 'body<<PR_BODY_EOF'
            cat "$RUNNER_TEMP/pr_body.md"
            echo 'PR_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open or update bump PR
        if: steps.diff.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PAT }}
          base: main
          # Stable branch — successive runs update the same PR rather than
          # piling up stale ones for older versions.
          branch: chore/lexicon-bump
          delete-branch: false
          title: "chore(lexicons): bump @atproto/lex to ${{ steps.post.outputs.new_version }}"
          body: ${{ steps.body.outputs.body }}
          labels: |
            lexicon-bump
            dependencies
            ${{ steps.body.outputs.breaking == 'true' && 'breaking-change' || '' }}
          commit-message: |
            chore(lexicons): bump @atproto/lex to ${{ steps.post.outputs.new_version }}

            Refresh lexicons.json against @atproto/lex@${{ steps.post.outputs.new_version }}
            and regenerate Kotlin models.
